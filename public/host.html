<!DOCTYPE html>
<html>
<head>
<title>Host</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="controls">
  <button onclick="start()">▶ START</button>
  <button onclick="finish()">🏁 FINISH</button>
  <button onclick="resetScore()">RESET</button>
</div>

<h1 id="timer">-</h1>
<div id="board"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const board=document.getElementById("board");

// SOUND
const sounds={
  buzzer:new Audio("sounds/buzzer.mp3"),
  correct:new Audio("sounds/correct.mp3"),
  wrong:new Audio("sounds/wrong.mp3")
};

socket.emit("get-data");

socket.on("init",render);
socket.on("score-update",render);

socket.on("timer",(t)=>{
  document.getElementById("timer").innerText=t;
});

socket.on("buzz-result",(winner)=>{
  document.querySelectorAll(".card").forEach(c=>{
    c.style.border=(c.dataset.name===winner)
      ?"4px solid green":"1px solid #ccc";
  });
});

socket.on("play-sound",(type)=>{
  sounds[type]?.play();
});

function render(data){
  board.innerHTML="";
  Object.keys(data.players)
    .sort((a,b)=>data.players[b].score-data.players[a].score)
    .forEach(name=>{
      const div=document.createElement("div");
      div.className="card";
      div.dataset.name=name;

      div.innerHTML=`
        <h3>${name}</h3>
        <p>${data.players[name].score}</p>
        <button onclick="add('${name}',1)">+1</button>
        <button onclick="add('${name}',-1)">-1</button>
      `;

      board.appendChild(div);
    });
}

function add(n,v){socket.emit("score",{name:n,value:v});}
function start(){socket.emit("start-round");}
function finish(){socket.emit("finish");}
function resetScore(){socket.emit("reset-score");}
</script>
</body>
</html>
